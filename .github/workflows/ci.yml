name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build the Windows app
        if: runner.os == 'Windows'
        run: cargo build --release -p hdec-gui
      - name: Build the macOS app
        if: runner.os == 'macOS'
        # Zipped with ditto: artifact uploads drop the executable bit.
        run: |
          packaging/macos/bundle.sh
          ditto -c -k --keepParent target/release/HDEC.app target/release/HDEC-macos.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: hdec-windows
          path: target/release/hdec.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: hdec-macos
          path: target/release/HDEC-macos.zip
      - name: No C/C++ in the dependency tree
        shell: bash
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            if cargo tree -i cc --target "$t" -e normal,build 2>/dev/null | grep -q .; then
              echo "cc found for $t"; cargo tree -i cc --target "$t" -e normal,build; exit 1
            fi
          done
