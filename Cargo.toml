[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hdec-core = { path = "crates/hdec-core" }
# zip: never enable `zstd` (C). Rust backends only: zlib-rs, libbz2-rs-sys, lzma-rust2.
zip = { version = "9.0.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "ppmd", "jiff-02", "unreserved"] }
jiff = "0.2"
tar = "0.4.46"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6.1"          # default backend is libbz2-rs-sys (pure Rust)
lzma-rust2 = "0.21"      # same version zip uses
ruzstd = "0.9.1"
# never enable `zstd` (C)
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd"] }
tempfile = "3"
crc32fast = "1.5"
# `parallel` = rayon (pure Rust); never `recovery` unchecked
rars = { version = "0.10.0", default-features = false, features = ["encryption", "write", "parallel"] }
eframe = "0.36.2"
egui_extras = "0.36.2"
rfd = "0.17.2"
zeroize = "1.9.1"
# dev-only: headless screenshots of the GUI
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
egui-phosphor = { version = "0.14.0", features = ["regular", "fill"] }
# Windows only (build script): embeds the .exe icon; calls rc.exe, no C compiled.
winresource = "0.1.34"
# macOS only: receive files opened from Finder (same versions rfd uses).
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSNotification", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# Compression crates are unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
