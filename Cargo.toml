[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
hdec-core = { path = "crates/hdec-core" }
# zip: never enable `zstd` (C). Rust backends only: zlib-rs, libbz2-rs-sys, lzma-rust2.
zip = { version = "9.0.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "ppmd", "jiff-02", "unreserved"] }
jiff = "0.2"
tar = "0.4.46"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6.1"          # default backend is libbz2-rs-sys (pure Rust)
lzma-rust2 = "0.21"      # same version zip uses
ruzstd = "0.9.1"
# never enable `zstd` (C)
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd"] }
tempfile = "3"
crc32fast = "1.5"
# `parallel` = rayon (pure Rust); never `recovery` unchecked
rars = { version = "0.10.0", default-features = false, features = ["encryption", "write", "parallel"] }
eframe = "0.36.2"
egui_extras = "0.36.2"
rfd = "0.17.2"
zeroize = "1.9.1"
# dev-only: headless screenshots of the GUI
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
egui-phosphor = { version = "0.14.0", features = ["regular", "fill"] }
# Windows only (build script): embeds the .exe icon; calls rc.exe, no C compiled.
winresource = "0.1.34"
# macOS only: receive files opened from Finder (same versions rfd uses).
objc2 = "0.6.5"
# Also: dragging entries out as file promises.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
block2 = "0.6.2"
# Windows only: dragging entries out (shell data object, our IDropSource). Pure Rust.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"   # `#[implement]` expands to paths in it
# The native window behind eframe's, for the OS drag (same version eframe uses).
raw-window-handle = "0.6.2"

# Compression crates are unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
